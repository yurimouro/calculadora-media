<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="container">

    <h1>📚 Calculadora de Média</h1>    
    <p class="subtitulo">Sistema de Notas do Aluno</p>


    <div id="formulario">
        <label>Nome do Aluno:</label>
        <input type="text" id="nome" placeholder="Digite o nome do aluno" required>

        <label>Nome do Disciplina:</label>
        <select id="disciplina" required>
            <option value="">Selecione a disciplina</option>
            <option value="FDD">Fundamentos do Design Digital</option>
            <option value="FTDI">Fotografia Digital</option>
            <option value="PRAAI">Projeto de Áudio e Vídeo I</option>
        </select>


        <div class="notas">

            <div>
        <label>1º Bimestre</label>
        <input type="number" id="nota1" placeholder="Digite a nota" required>
            </div>

            <div>
        <label>2º Bimestre</label>
        <input type="number" id="nota2" placeholder="Digite a nota" required>
            </div>

            <div>
        <label>3º Bimestre</label>
        <input type="number" id="nota3" placeholder="Digite a nota" required>
            </div>

            <div>
        <label>4º Bimestre</label>
        <input type="number" id="nota4" placeholder="Digite a nota" required>
            </div>
        </div>
    
    <button id="calcular" onclick="calcularMedia()">calcularMedia</button>
    <button id="novocalculo" onclick="calcularNovo()">Calcular Novamente</button>

    <a href="" id="link">Calculadora Normal</a>

    </div>

    <div id="resultado" class="resultado">

        <p><p>Preencha os dados acima e clique em calcular média.</p></p>
    </div>

 </div>


<script src="../js/calcular-media.js"></script>
</body>
</html>
